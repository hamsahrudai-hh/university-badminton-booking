spring.application.name=university-badminton-backend
server.port=8081

# Isolated In-Memory H2 Test Database (prevents mutating real development database)
spring.datasource.url=jdbc:h2:mem:badminton_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable schema.sql execution in tests so Hibernate creates/drops schema in-memory
spring.sql.init.mode=never

# Test Registration Properties
app.registration.allowed-email-domain=vitapstudent.ac.in
app.registration.verification-token-expiry-hours=24
app.email.provider=dev
app.email.verification-base-url=http://localhost:8081

# Test Timezone & Schedulers
app.timezone=Asia/Kolkata
app.credit-reset.scheduler.enabled=false
app.credit-reset.scheduler.cron=0 0 0 * * MON
