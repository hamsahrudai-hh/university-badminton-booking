spring.application.name=university-badminton-backend
server.port=8081

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:badminton_booking}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:badminton_user}
spring.datasource.password=${MYSQL_PASSWORD:badminton_dev_pass_2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Student Registration and Email Verification Configuration
app.registration.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:vitapstudent.ac.in}
app.registration.verification-token-expiry-hours=${VERIFICATION_TOKEN_EXPIRY_HOURS:24}

# Email Provider Configuration (dev: safe console logging without external delivery; smtp: real mail dispatch)
app.email.provider=${APP_EMAIL_PROVIDER:dev}
app.email.verification-base-url=${APP_EMAIL_VERIFICATION_BASE_URL:http://localhost:8081}

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:university-badminton-court-booking-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}

# Automatic No-Show Processing Scheduler (Safe default: disabled until explicitly enabled)
app.no-show.scheduler.enabled=${APP_NO_SHOW_SCHEDULER_ENABLED:false}
app.no-show.scheduler.cron=${APP_NO_SHOW_SCHEDULER_CRON:0 * * * * *}

# University Timezone Configuration
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Automated Weekly Student-Credit Reset Scheduler (Safe default: disabled until explicitly enabled)
# Runs Monday at 00:00:00 midnight in the configured university timezone (Asia/Kolkata)
app.credit-reset.scheduler.enabled=${APP_CREDIT_RESET_SCHEDULER_ENABLED:false}
app.credit-reset.scheduler.cron=${APP_CREDIT_RESET_SCHEDULER_CRON:0 0 0 * * MON}


